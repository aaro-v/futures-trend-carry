name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,data]"
      - run: ruff check .
      - run: pytest
      - run: futures-backtest sample-data --out data/synthetic --days 780
      - run: futures-backtest run --data-dir data/synthetic --output-dir reports/ci --bootstrap-samples 25
